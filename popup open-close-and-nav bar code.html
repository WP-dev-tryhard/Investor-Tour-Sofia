<style>

  left: 0 !important;

  z-index: 999 !important;
  transition: transform 0.15s ease-in-out !important;
  will-change: transform;
}
	
@media (max-width: 1200px) {
#headerWrappervITS {
		z-index: 99999 !important;
	}
}
#headerWrappervITS.nav-hidden {
  transform: translateY(-153px) !important;
}
main {
  margin-top: 217px !important;
  transition: margin-top 0.15s ease-in-out !important;
}
.nav-hidden-content {
  margin-top: 153px !important; /* original 153 */
}
.nav-hidden-content-tablet {
  margin-top: 100px !important; /* original 100 */
}
.nav-hidden-content-mobile {
  margin-top: 0px !important; /* original 100 */
}
	
@media (max-width: 1200px) {
	main {
		margin-top: 0px !important; /* original 153 */

@media (max-width: 767px) {

/* --- New: scroll-past-10px state --- */
.nav-bar-logo-white,
.nav-bar-logo-blue {
  position: absolute !important;
}

/* n-bar0 now gets scrolled-10 directly, not via header ancestor */
.n-bar0.scrolled-10 {
  background-color: #ffffff !important;
}

#headerWrapperv3.scrolled-10 .menu-btn__burger,
#headerWrappervITS.scrolled-10 .menu-btn__burger {
  background: #172643 !important;
}
#headerWrapperv3.scrolled-10 .menu-btn__burger::before,
#headerWrappervITS.scrolled-10 .menu-btn__burger::before,
#headerWrapperv3.scrolled-10 .menu-btn__burger::after,
#headerWrappervITS.scrolled-10 .menu-btn__burger::after {
  background: #172643 !important;
}

#headerWrapperv3.scrolled-10 .nav-bar-logo-white,
#headerWrappervITS.scrolled-10 .nav-bar-logo-white {
  display: none !important;
}
#headerWrapperv3.scrolled-10 .nav-bar-logo-blue,
#headerWrappervITS.scrolled-10 .nav-bar-logo-blue {
  display: flex !important;
}
</style>
<script>
window.addEventListener('load', function () {
  const header = document.getElementById('headerWrappervITS');
  const content = document.querySelector('main');
  const nBar0 = header ? header.querySelector('.n-bar0') : null;
  if (!header) return;
  let lastScrollY = window.scrollY;
  let ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      window.requestAnimationFrame(function () {
        const isMobile = window.innerWidth <= 767;
        const isTablet = window.innerWidth <= 1200;
        const currentScrollY = window.scrollY;

        // --- Original hide/show nav logic (unchanged) ---
        if (currentScrollY > lastScrollY && currentScrollY > 50) {
          if (!window.popupNavOpen) {  // Check popup state once at the top
            header.classList.add('nav-hidden');
            if (isMobile) {
              content.classList.add('nav-hidden-content-mobile');
              content.classList.remove('nav-hidden-content-tablet');
              content.classList.remove('nav-hidden-content');
            } else if (isTablet) {
              content.classList.add('nav-hidden-content-tablet');
              content.classList.remove('nav-hidden-content-mobile');
              content.classList.remove('nav-hidden-content');
            } else {
              content.classList.add('nav-hidden-content');
              content.classList.remove('nav-hidden-content-tablet');
              content.classList.remove('nav-hidden-content-mobile');
            }
          }
        } else {
          header.classList.remove('nav-hidden');
          content.classList.remove('nav-hidden-content');
          content.classList.remove('nav-hidden-content-tablet');
          content.classList.remove('nav-hidden-content-mobile');
        }

        // --- New: toggle scrolled-10 state past 10px, independent of direction ---
        if (currentScrollY > 10) {
          header.classList.add('scrolled-10');
          if (nBar0) nBar0.classList.add('scrolled-10');
        } else {
          header.classList.remove('scrolled-10');
          if (nBar0) nBar0.classList.remove('scrolled-10');
        }

        lastScrollY = currentScrollY;
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
});
</script>

<div class="menu-btn" id="menu-trigger">
    <div class="menu-btn__burger"></div>
  </div>


<style>
.menu-btn {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 30px;
  height: 30px;
  cursor: pointer;
  transition: all .5s ease-in-out;
  /* border: 3px solid #fff; */
}
.menu-btn__burger {
  width: 25px;
  height: 3px;
  background: #ffffff;
  border-radius: 3px;
  transition: all .5s ease-in-out;
}
.menu-btn__burger::before,
.menu-btn__burger::after {
  content: '';
  position: absolute;
  width: 25px;
  height: 3px;
  background: #ffffff;
  border-radius: 5px;
  transition: all .5s ease-in-out;
}
.menu-btn__burger::before {
  transform: translateY(-8px);
}
.menu-btn__burger::after {
  transform: translateY(8px);
}
/* ANIMATION */
.menu-btn.open .menu-btn__burger {
  transform: translateX(0px);
  background: transparent;

}
/* Code 1's scrolled-10 rule (#headerWrapperv3/#headerWrappervITS.scrolled-10
   .menu-btn__burger) forces the middle bar's background back to #172643
   with !important, which otherwise wins over the rule above once the page
   is scrolled past 10px. This matches or beats that specificity so the
   middle bar actually goes transparent when the menu is open. */
:is(#headerWrappervITS).scrolled-10 .menu-btn.open .menu-btn__burger {
  background: transparent !important;
}

/* Same conflict as above, but for the other elements Code 1's
   scrolled-10 state locks with !important: the burger's outer
   lines, the logo swap, and the nav-bar background. These key off
   the header's own "menu-open" class (toggled in the script below)
   instead of .menu-btn.open, since the logo/nav-bar elements aren't
   descendants of .menu-btn. Applies regardless of scroll position,
   and still wins over the scrolled-10 rules when both are active. */
:is(#headerWrappervITS).menu-open .menu-btn__burger::before,
:is(#headerWrappervITS).menu-open .menu-btn__burger::after {
  background: #ffffff !important;
}

:is(#headerWrappervITS).menu-open .nav-bar-logo-white.nav-bar-logo-white {
  display: flex !important;
}
:is(#headerWrappervITS).menu-open .nav-bar-logo-blue.nav-bar-logo-blue {
  display: none !important;
}

:is(#headerWrappervITS).menu-open .n-bar0 {
  background-color: #172643 !important;
}

.menu-btn.open .menu-btn__burger::before {
  transform: rotate(45deg) ;
}
.menu-btn.open .menu-btn__burger::after {
  transform: rotate(-45deg) ;
}
</style>

<script>
    window.popupNavOpen = false;  // Explicitly on window

    const menuBtn = document.querySelector('.menu-btn');
    const menuHeader = document.getElementById('headerWrappervITS');
    let menuOpen = false;

    function closeMenu() {
      menuBtn.classList.remove('open');
      if (menuHeader) menuHeader.classList.remove('menu-open');
      menuOpen = false;
      window.popupNavOpen = false;
      // elementorProFrontend.modules.popup.closePopup() reads its own
      // internally-tracked event and throws if called directly with
      // arbitrary args, so instead we click Elementor's own close
      // button (.dialog-close-button) - the same thing a user clicking
      // the popup's X would trigger, which is already known to work.
      const closeBtn = document.querySelector('.dialog-close-button');
      if (closeBtn) closeBtn.click();
    }

    menuBtn.addEventListener('click', () => {
      if (!menuOpen) {
        menuBtn.classList.add('open');
        if (menuHeader) menuHeader.classList.add('menu-open');
        menuOpen = true;
        window.popupNavOpen = true;
        elementorProFrontend.modules.popup.showPopup({ id: 807 });
      } else {
        closeMenu();
      }
    });

    // Clicking a link inside the mobile menu (#menu-mobile-menu is the
    // <ul>, links are <a href="#section"> inside its <li> items) closes
    // the popup and resets the burger/header state.
    document.addEventListener('click', (e) => {
      if (e.target.closest('#menu-mobile-menu a')) {
        closeMenu();
      }
    });
</script>
